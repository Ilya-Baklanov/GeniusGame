<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1, shrink-to-fit=no, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <link rel="preload" as="font" href="./fonts/MEGASANSBETA-REGULAR_V02-08.OTF" type="font/otf">
  <link rel="preload" as="font" href="./fonts/MegaSansJ-Light.otf" type="font/otf">
  <link rel="preload" as="font" href="./fonts/MegaSansJ-Medium.otf" type="font/otf">
  <link rel="preload" as="font" href="./fonts/MegaSansJ-Regular.otf" type="font/otf">
  <link rel="preload" as="font" href="./fonts/MEGASANSS-BOLD.OTF" type="font/otf">
  <!--
        manifest.json provides metadata used when your web app is installed on a
        user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
      -->
  <link rel="manifest" href="./public/manifest.json" />

  <title>VK Mini App Boilerplate</title>

  <style type="text/css" media="screen, print">
    @font-face {
      font-family: "Mega Sans Beta";
      src: url("./fonts/MEGASANSBETA-REGULAR_V02-08.OTF")format("opentype");

      font-weight: 400;
      font-style: normal;
    }

    @font-face {
      font-family: "Mega Sans J";
      src: url("./fonts/MegaSansJ-Light.otf")format("opentype");

      font-weight: 300;
      font-style: normal;
    }

    @font-face {
      font-family: "Mega Sans J";
      src: url("./fonts/MegaSansJ-Regular.otf")format("opentype");

      font-weight: 400;
      font-style: normal;
    }

    @font-face {
      font-family: "Mega Sans J";
      src: url("./fonts/MegaSansJ-Medium.otf")format("opentype");

      font-weight: 500;
      font-style: normal;
    }

    @font-face {
      font-family: "Mega Sans S";
      src: url("./fonts/MEGASANSS-BOLD.OTF")format("opentype");

      font-weight: 400;
      font-style: normal;
    }
  </style>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
